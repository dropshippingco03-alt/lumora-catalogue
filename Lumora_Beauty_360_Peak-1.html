/*
Each row:
[id, category, name, landed cost]

The code calculates retail automatically:
retail = landed cost × 4

IMAGE + LINK are intentionally blank and are added
through the product records below.
*/

const media={};
/*
Example:
media.B001={
  image:"https://...",
  link:"https://sites.google.com/..."
};
*/

const data=products.map(([id,category,name,cost])=>({
 id,category,name,cost,
 price:Math.round(cost*4*100)/100,
 image:media[id]?.image||"",
 link:media[id]?.link||""
}));

const INITIAL=8;
const STEP=8;
let filter="ALL",query="",sortMode="featured",visible=INITIAL;

const grid=document.getElementById("grid");
const count=document.getElementById("count");
const empty=document.getElementById("empty");
const load=document.getElementById("load");
const less=document.getElementById("less");
const search=document.getElementById("search");
const sort=document.getElementById("sort");

function esc(v){
 return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function getItems(){
 let a=data.filter(p=>
   (filter==="ALL"||p.category===filter) &&
   (p.name+" "+p.category).toLowerCase().includes(query.toLowerCase())
 );
 if(sortMode==="az")a.sort((x,y)=>x.name.localeCompare(y.name));
 if(sortMode==="low")a.sort((x,y)=>x.price-y.price);
 if(sortMode==="high")a.sort((x,y)=>y.price-x.price);
 return a;
}

function money(n){
 return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);
}

function render(){
 const all=getItems(),shown=all.slice(0,visible);
 grid.innerHTML=shown.map((p,i)=>`
 <article class="product">
  <div class="image">
   <span class="index">${String(data.indexOf(p)+1).padStart(3,"0")}</span>
   ${p.image?
    `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
     <div class="placeholder" style="display:none">IMAGE UNAVAILABLE</div>`:
    `<div class="placeholder">ADD PRODUCT IMAGE</div>`}
  </div>
  <div class="cat">${esc(p.category)}</div>
  <h2 class="name">${esc(p.name)}</h2>
  <div class="price">${money(p.price)}</div>
  ${p.link?
    `<a class="view" href="${esc(p.link)}" target="_blank" rel="noopener">VIEW PRODUCT</a>`:
    `<span class="view disabled">PRODUCT PAGE SOON</span>`}
 </article>`).join("");

 count.textContent=`${all.length} PRODUCTS`;
 empty.style.display=all.length?"none":"block";
 load.style.display=visible<all.length?"inline-flex":"none";
 less.style.display=visible>INITIAL?"inline-flex":"none";
}

document.querySelectorAll(".filter").forEach(btn=>btn.addEventListener("click",()=>{
 document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
 filter=btn.dataset.filter;visible=INITIAL;render();
}));

search.addEventListener("input",()=>{query=search.value.trim();visible=INITIAL;render()});
sort.addEventListener("change",()=>{sortMode=sort.value;visible=INITIAL;render()});
load.addEventListener("click",()=>{visible+=STEP;render()});
less.addEventListener("click",()=>{visible=INITIAL;render();document.querySelector(".toolbar").scrollIntoView({behavior:"smooth",block:"start"})});

render();
</script>
